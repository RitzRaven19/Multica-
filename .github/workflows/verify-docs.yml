name: Verify Group 2 pipeline

on:
  push:
    branches: [main]
    paths:
      - "shared_outputs/*.json"
      - "shared_outputs/traceability_matrix.csv"
      - "shared_outputs/BRD.md"
      - "scripts/verify_pipeline.py"
      - "scripts/render_docx.py"
  pull_request:
    paths:
      - "shared_outputs/*.json"
      - "shared_outputs/traceability_matrix.csv"
      - "shared_outputs/BRD.md"
      - "scripts/verify_pipeline.py"
      - "scripts/render_docx.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pipeline verification
        id: verify
        run: |
          python3 scripts/verify_pipeline.py | tee verify_output.txt
        continue-on-error: true

      - name: Record result
        run: |
          if grep -q "^FAIL" verify_output.txt; then
            echo "failed=true" >> "$GITHUB_ENV"
          else
            echo "failed=false" >> "$GITHUB_ENV"
          fi

      - name: Open issue on failure
        if: env.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('verify_output.txt', 'utf8');
            const title = 'Pipeline verification failed — ' + context.sha.slice(0, 7);
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'doc-verification',
            });
            const openMatch = existing.find(i => i.title.startsWith('Pipeline verification failed'));
            const issueBody = "Automated traceability check failed on `" + context.sha + "`.\n\n```\n" + body + "\n```\n\nSee `scripts/verify_pipeline.py` and the failing run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            if (openMatch) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openMatch.number,
                body: issueBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
                labels: ['doc-verification'],
              });
            }

      - name: Fail the job if verification failed
        if: env.failed == 'true'
        run: exit 1

      - name: Render BRD/FRD/UAT as .docx
        if: env.failed == 'false'
        run: |
          pip install python-docx
          python3 scripts/render_docx.py

      - name: Upload .docx artifacts
        if: env.failed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-documents
          path: |
            shared_outputs/BRD.docx
            shared_outputs/FRD.docx
            shared_outputs/UAT.docx
